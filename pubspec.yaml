name: delight
description: Delight – Africa's Super App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^13.2.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  xrpl_dart: ^7.3.0
  bip39: ^1.0.6
  http: ^1.2.1
  web_socket_channel: ^2.4.0
  dio: ^5.4.3
  supabase_flutter: ^2.5.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0
  image_picker: ^1.0.7
  video_player: ^2.8.3
  photo_view: ^0.14.0
  local_auth: ^2.1.8
  crypto: ^3.0.3
  encrypt: ^5.0.3
  intl: ^0.19.0
  timeago: ^3.6.1
  uuid: ^4.4.0
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4
  open_filex: ^4.3.4
  share_plus: ^10.0.0
  google_mobile_ads: ^5.1.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.2.6
  package_info_plus: ^8.0.0
  connectivity_plus: ^6.0.3
  cupertino_icons: ^1.0.6

  # GPS — for nearest agent finder
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Push notifications — Firebase Cloud Messaging
  firebase_core: ^3.6.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^17.2.2

  # Permissions — runtime permission requests
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
