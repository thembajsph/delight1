<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delight</title>
<style>
  :root{color-scheme:dark;--bg:#060f0a;--card:#10241a;--em:#00c96a;--tx:#e8f5ee;--mut:#8fb5a0}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:16px}
  .c{max-width:420px;width:100%;background:var(--card);border-radius:20px;padding:28px;text-align:center}
  h1{font-size:24px;margin:0 0 8px} p{color:var(--mut);margin:0 0 20px;line-height:1.5}
  a.b{display:block;padding:14px;border-radius:14px;text-decoration:none;font-weight:700;margin-top:10px}
  #open{background:var(--em);color:#04120a} #store{border:1px solid var(--em);color:var(--em)}
  small{display:block;margin-top:16px;color:var(--mut)}
</style></head><body>
<div class="c">
  <div style="font-size:42px">🎉</div>
  <h1 id="title">Pay with Delight</h1>
  <p id="sub">Open in the Delight app to pay.</p>
  <a class="b" id="open" href="#">Open in Delight</a>
  <a class="b" id="store" href="#">Get the app</a>
  <small id="hint"></small>
</div>
<script src="/config.js"></script><script src="/link.js"></script>
</body></html>
